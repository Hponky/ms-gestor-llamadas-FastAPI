services:
  # Microservicio HAR-228
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    environment:
      - REDIS_HOST=redis
      - QDRANT_URL=http://qdrant:6333
      - SESSION_PROVIDER=redis
    depends_on:
      - redis
      - qdrant

  # Base de Datos de Sesiones (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Base de Datos Vectorial (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  redis_data:
  qdrant_data:
